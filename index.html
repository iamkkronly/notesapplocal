<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sakura Notes · 桜</title>

  <!-- PWA: offline + installable -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f2e9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sakura Notes">
  <meta name="author" content="Kaustav Kanti Ray (@iamkkronly)">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ---------------------------------------------------------
       SAKURA NOTES — clean Japanese theme
       Light: washi paper · sumi ink · vermillion & sakura
       Dark : indigo night (ai-iro) · sakura glow
       --------------------------------------------------------- */
    :root {
      --font-serif: 'Hiragino Mincho ProN', 'Yu Mincho', 'YuMincho', 'Noto Serif JP', 'Noto Serif', Georgia, 'Times New Roman', serif;
      --font-sans: system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, Helvetica, Arial, sans-serif;

      --bg-base: #f7f2e9;
      --bg-tint: #f0e9db;
      --dot: rgba(64, 52, 40, 0.05);
      --glow-a: rgba(189, 68, 55, 0.06);
      --glow-b: rgba(231, 158, 180, 0.10);

      --card-bg: #fffdf8;
      --card-border: rgba(64, 52, 40, 0.08);
      --text-primary: #2f2a22;
      --text-secondary: #635a4c;
      --text-muted: #a29785;
      --border-light: rgba(64, 52, 40, 0.09);

      --accent: #bd4437;             /* shu-iro · vermillion */
      --accent-hover: #a2372c;
      --accent-soft: rgba(189, 68, 55, 0.08);
      --sakura: #e79eb4;
      --sakura-deep: #d97f9a;
      --pin-color: #d97f9a;

      --delete-bg: #faeae7;
      --delete-color: #a5372c;
      --input-bg: #fffef9;
      --input-border: rgba(64, 52, 40, 0.14);

      --shadow-sm: 0 8px 22px -14px rgba(70, 50, 35, 0.22);
      --shadow-md: 0 22px 42px -22px rgba(70, 50, 35, 0.30);
      --modal-bg: rgba(47, 42, 34, 0.42);

      --petal-a: #f7cbd8;
      --petal-b: #efa6bc;
    }

    body.dark {
      --bg-base: #171a26;
      --bg-tint: #111420;
      --dot: rgba(255, 255, 255, 0.045);
      --glow-a: rgba(231, 147, 168, 0.07);
      --glow-b: rgba(189, 68, 55, 0.05);

      --card-bg: #1f2333;
      --card-border: rgba(255, 255, 255, 0.06);
      --text-primary: #ede8de;
      --text-secondary: #b8b3a5;
      --text-muted: #807b70;
      --border-light: rgba(255, 255, 255, 0.08);

      --accent: #e793a8;             /* sakura in the dark */
      --accent-hover: #f2a7bb;
      --accent-soft: rgba(231, 147, 168, 0.13);
      --sakura: #f2a9bb;
      --sakura-deep: #e793a8;
      --pin-color: #f0a3b8;

      --delete-bg: #3a2429;
      --delete-color: #f09a9a;
      --input-bg: #181c2a;
      --input-border: rgba(255, 255, 255, 0.10);

      --shadow-sm: 0 8px 22px -14px rgba(0, 0, 0, 0.55);
      --shadow-md: 0 22px 42px -22px rgba(0, 0, 0, 0.62);
      --modal-bg: rgba(8, 10, 18, 0.66);
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      min-height: 100vh;
      letter-spacing: 0.005em;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% -10%, var(--glow-a), transparent 42%),
        radial-gradient(circle at 92% 112%, var(--glow-b), transparent 45%),
        radial-gradient(circle, var(--dot) 1px, transparent 1.35px);
      background-size: 100% 100%, 100% 100%, 26px 26px;
      background-attachment: fixed;
      transition: background-color 0.3s, color 0.3s;
    }

    ::selection { background: rgba(231, 158, 180, 0.45); }

    button, input, select, textarea { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ----- ANIMATIONS ----- */
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeScale {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeOut {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.94); }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); background-color: var(--accent-soft); }
      100% { transform: scale(1); }
    }
    @keyframes shakePin {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(8deg); }
      75% { transform: rotate(-8deg); }
    }
    @keyframes petal-fall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: var(--po, 0.4); }
      85%  { opacity: var(--po, 0.4); }
      100% { transform: translate3d(var(--drift, 10vw), 108vh, 0) rotate(var(--spin, 300deg)); opacity: 0; }
    }
    .animate-card-in {
      animation: fadeSlideUp 0.2s ease-out forwards;
    }
    .animate-card-out {
      animation: fadeOut 0.15s ease-in forwards;
      pointer-events: none;
    }
    .animate-pulse {
      animation: pulse 0.2s ease-out;
    }
    .animate-pin {
      animation: shakePin 0.2s ease;
    }
    .animate-modal-in {
      animation: fadeScale 0.2s ease-out;
    }
    .fade-transition {
      transition: opacity 0.15s ease;
    }

    /* falling sakura petals — subtle */
    .petal {
      position: fixed;
      top: -4vh;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(135deg, var(--petal-a), var(--petal-b));
      border-radius: 100% 0 100% 0;
      opacity: 0;
      animation: petal-fall linear forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .petal { display: none; }
    }

    .app {
      max-width: 1240px;
      margin: 0 auto;
      padding: 2.5rem 2rem 1.5rem;
      position: relative;
    }

    /* decorative sakura branch (top-right) */
    .branch-deco {
      position: absolute;
      top: -0.8rem;
      right: -0.6rem;
      width: 170px;
      height: auto;
      opacity: 0.38;
      pointer-events: none;
      z-index: 0;
    }
    body.dark .branch-deco { opacity: 0.22; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-bottom: 2.25rem;
      padding-bottom: 1.1rem;
      border-bottom: 1px solid var(--border-light);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.15;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    /* hanko (red seal) with the kanji for sakura */
    .hanko {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      background: var(--accent);
      color: #fffdf8;
      border-radius: 9px;
      font-size: 1.3rem;
      font-weight: 700;
      font-family: var(--font-serif);
      transform: rotate(-4deg);
      box-shadow: 0 5px 12px -6px rgba(189, 68, 55, 0.5);
      flex: none;
    }

    .subtitle {
      margin-top: 0.45rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.18em;
    }

    .stats {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.4rem 1.1rem;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text-secondary);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.6rem;
      background: var(--card-bg);
      padding: 0.65rem 0.9rem;
      border-radius: 1rem;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-sm);
      position: relative;
      z-index: 1;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--input-bg);
      padding: 0.5rem 1.05rem;
      border-radius: 100px;
      border: 1px solid var(--input-border);
      color: var(--text-muted);
      transition: border 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      color: var(--accent);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.9rem;
      color: var(--text-primary);
    }
    .search-box input::placeholder { color: var(--text-muted); }

    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      padding: 0.5rem 1rem;
      border-radius: 100px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: border 0.2s;
    }
    .sort-select:hover { border-color: var(--accent); }

    .settings-btn {
      width: 40px;
      height: 40px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      transition: 0.2s;
    }
    .settings-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: rotate(24deg);
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin: 1.8rem 0 2.2rem;
      position: relative;
      z-index: 1;
    }

    .note-card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.4rem 1.45rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.28s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      cursor: pointer;
      border: 1px solid var(--card-border);
      position: relative;
    }

    .note-card.pinned {
      border-left: 4px solid var(--sakura-deep);
    }

    .note-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: rgba(217, 127, 154, 0.32);
    }

    .note-title-preview {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--text-primary);
      margin-bottom: 0.55rem;
      word-break: break-word;
      padding-right: 2.2rem;
    }

    .pin-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      transition: 0.15s;
    }
    .pin-badge:hover { transform: scale(1.15); }
    .pin-badge.pinned { color: var(--pin-color); }

    .note-snippet {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0.6rem 0 1.05rem;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-top: 1px solid var(--border-light);
      padding-top: 0.8rem;
    }

    .icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .icon-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .icon-btn.danger:hover {
      background: var(--delete-bg);
      color: var(--delete-color);
    }

    .empty-grid {
      text-align: center;
      padding: 4.5rem 2rem;
      background: var(--card-bg);
      border-radius: 1.25rem;
      color: var(--text-muted);
      border: 1px dashed var(--input-border);
      grid-column: 1 / -1;
      font-size: 0.92rem;
    }
    .empty-jp {
      display: block;
      font-family: var(--font-serif);
      font-size: 1rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }

    .full-window {
      background: var(--card-bg);
      border-radius: 1.25rem;
      padding: 2rem;
      margin-top: 0.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--card-border);
      position: relative;
      z-index: 1;
    }

    .window-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.9rem;
      flex-wrap: wrap;
      gap: 15px;
    }

    .back-btn {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      padding: 0.5rem 1.25rem;
      border-radius: 100px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .delete-window-btn, .duplicate-window-btn {
      background: var(--delete-bg);
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.86rem;
      color: var(--delete-color);
      cursor: pointer;
      transition: 0.2s;
    }

    .duplicate-window-btn {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .edit-window-btn, .save-window-btn {
      background: var(--accent);
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.86rem;
      color: #fffdf8;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 18px -10px rgba(189, 68, 55, 0.45);
    }
    .edit-window-btn:hover, .save-window-btn:hover {
      background: var(--accent-hover);
    }

    .cancel-window-btn {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      padding: 0.5rem 1.25rem;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.86rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.2s;
    }
    .cancel-window-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .view-title, .editor-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .view-title {
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.6rem;
      margin-bottom: 1.2rem;
    }

    .view-content {
      font-size: 0.98rem;
      line-height: 1.75;
      white-space: pre-wrap;
      background: var(--input-bg);
      padding: 1.25rem;
      border-radius: 1rem;
      min-height: 320px;
      border: 1px solid var(--input-border);
    }

    .editor-title {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 1.4rem;
      outline: none;
      background: transparent;
    }
    .editor-title:focus { border-bottom-color: var(--accent); }

    .editor-content {
      width: 100%;
      font-size: 0.98rem;
      line-height: 1.75;
      padding: 1.05rem;
      border: 1px solid var(--input-border);
      border-radius: 1rem;
      outline: none;
      resize: vertical;
      min-height: 320px;
      background: var(--input-bg);
      color: var(--text-primary);
    }
    .editor-content:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .editor-info {
      display: flex;
      justify-content: space-between;
      margin-top: 0.8rem;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .hidden { display: none; }

    .floating-add {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      width: 60px;
      height: 60px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 30px -10px rgba(189, 68, 55, 0.55);
      cursor: pointer;
      border: none;
      z-index: 30;
      color: #fffdf8;
      transition: transform 0.25s ease;
    }
    .floating-add:hover { transform: rotate(90deg) scale(1.06); }

    footer {
      margin-top: 2.6rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .footer-credit {
      font-size: 0.8rem;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }
    .footer-credit a { font-weight: 600; }
    .footer-sub {
      margin-top: 0.45rem;
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-bg);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .settings-modal {
      background: var(--card-bg);
      border-radius: 1.25rem;
      padding: 1.8rem;
      width: 90%;
      max-width: 400px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--card-border);
    }
    .settings-modal h3 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      color: var(--text-primary);
    }
    .settings-modal .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .setting-item button {
      background: var(--accent);
      border: none;
      padding: 0.42rem 1.1rem;
      border-radius: 100px;
      color: #fffdf8;
      cursor: pointer;
      font-size: 0.82rem;
      transition: 0.2s;
    }
    .setting-item button:hover { background: var(--accent-hover); }
    .setting-item button.danger {
      background: var(--delete-bg);
      color: var(--delete-color);
    }
    .setting-value { font-size: 0.8rem; color: var(--text-muted); }
    .close-settings {
      width: 100%;
      margin-top: 1rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      padding: 0.6rem;
      border-radius: 100px;
      cursor: pointer;
      font-size: 0.86rem;
      color: var(--text-secondary);
      transition: 0.2s;
    }
    .close-settings:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @media (max-width: 640px) {
      .app { padding: 1.4rem 1.1rem; }
      .branch-deco { width: 105px; opacity: 0.26; top: -0.4rem; right: -0.2rem; }
      h1 { font-size: 1.8rem; }
      .hanko { width: 36px; height: 36px; font-size: 1.1rem; border-radius: 8px; }
      .view-title, .editor-title { font-size: 1.4rem; }
      .floating-add { width: 54px; height: 54px; bottom: 1.4rem; right: 1.4rem; }
      .full-window { padding: 1.25rem; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- decorative sakura branch -->
  <svg class="branch-deco" viewBox="0 0 220 140" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <path d="M215 8 C 175 18 140 42 118 74 C 106 92 100 108 98 132" fill="none" stroke="#9c7b64" stroke-width="3" stroke-linecap="round"/>
    <path d="M160 22 C 148 40 132 52 112 58" fill="none" stroke="#9c7b64" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M118 74 C 107 77 97 83 91 93" fill="none" stroke="#9c7b64" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(152 28)">
      <g fill="#f5c3d2" stroke="#e79eb4" stroke-width="1">
        <path d="M0 2 C 7 -4 7 -16 0 -20 C -7 -16 -7 -4 0 2 Z"/>
        <path d="M0 2 C 7 -4 7 -16 0 -20 C -7 -16 -7 -4 0 2 Z" transform="rotate(72)"/>

        <path d="M0 2 C 7 -4 7 -16 0 -20 C -7 -16 -7 -4 0 2 Z" transform="rotate(144)"/>
        <path d="M0 2 C 7 -4 7 -16 0 -20 C -7 -16 -7 -4 0 2 Z" transform="rotate(216)"/>

  <div class="header-bar">

    <div class="setting-item">
      <span>About</span>

<script>
  (function() {
    // ---------- DATA ----------
    let notesArray = [];
    let currentNoteId = null;
    let isEditMode = false;
    let currentSort = "newest";
    let searchQuery = "";

    // DOM elements
    const notesGridContainer = document.getElementById('notesGrid');
    const listViewDiv = document.getElementById('listViewContainer');
    const fullWindowDiv = document.getElementById('fullWindow');
    const backToListBtn = document.getElementById('backToListBtn');
    const floatingAddBtn = document.getElementById('floatingAddBtn');
    const notesCountSpan = document.getElementById('notesCount');
    const viewModeContainer = document.getElementById('viewModeContainer');
    const viewTitleSpan = document.getElementById('viewTitle');
    const viewContentDiv = document.getElementById('viewContent');
    const editModeContainer = document.getElementById('editModeContainer');
    const editorTitle = document.getElementById('editorTitle');
    const editorBody = document.getElementById('editorBody');
    const actionButtonsDiv = document.getElementById('windowActionButtons');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const settingsCog = document.getElementById('settingsCogBtn');
    const settingsModal = document.getElementById('settingsModal');
    const modalThemeBtn = document.getElementById('modalThemeBtn');
    const modalClearAllBtn = document.getElementById('modalClearAllBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const wordCountSpan = document.getElementById('wordCount');
    const charCountSpan = document.getElementById('charCount');

    const STORAGE_KEY = 'velvet_notes_power_v4';

    // clean SVG icons (used inside JS-rendered elements)
    const ICONS = {
      pin: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
      pinFilled: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
      copy: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      trash: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
    };

    // safe localStorage access (sandboxed previews / blocked storage)
    let ls;
    try {
      ls = window.localStorage;
      ls.getItem('velvet_storage_test');
    } catch (e) {
      ls = { getItem: function() { return null; }, setItem: function() {}, removeItem: function() {} };
    }

    // ---- helper: trigger animation on element ----
    function animateElement(el, animationClass, duration = 200) {
      if (!el) return;
      el.classList.add(animationClass);
      setTimeout(() => el.classList.remove(animationClass), duration);
    }

    function animateCard(cardElement, isDelete = false) {
      if (!cardElement) return;
      if (isDelete) {
        cardElement.classList.add('animate-card-out');
        setTimeout(() => {
          if (cardElement.parentNode) cardElement.remove();
        }, 150);
      } else {
        animateElement(cardElement, 'animate-card-in', 200);
      }
    }

    // persist
    function persistNotes() { ls.setItem(STORAGE_KEY, JSON.stringify(notesArray)); }

    function loadInitialNotes() {
      const stored = ls.getItem(STORAGE_KEY);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed)) {
            notesArray = parsed.map(n => ({ ...n, pinned: n.pinned || false, updatedAt: n.updatedAt || Date.now() }));
            return;
          }
        } catch(e) {}
      }
      notesArray = [
        { id: Date.now() + 101, title: "Welcome to Sakura Notes", content: "Your notes are saved privately on this device — and the app opens even without internet.\n\nPin important notes with the pin icon. Open settings for dark mode & tools.\n\nDeveloped by Kaustav Kanti Ray (@iamkkronly).", updatedAt: Date.now() - 3600000, pinned: true },
        { id: Date.now() + 102, title: "Smart features", content: "Pin to top\nSearch\nDuplicate\nFull-window editing\nDark mode (in settings)\nFully offline-ready", updatedAt: Date.now() - 1800000, pinned: false }
      ];
      persistNotes();
    }

    function getFilteredAndSortedNotes() {
      let filtered = notesArray.filter(n => {
        if (!searchQuery.trim()) return true;
        const haystack = (n.title + " " + n.content).toLowerCase();
        return haystack.includes(searchQuery.toLowerCase());
      });
      filtered.sort((a,b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      if (currentSort === "newest") filtered.sort((a,b) => (a.pinned === b.pinned ? b.updatedAt - a.updatedAt : (b.pinned ? 1 : -1)));
      else if (currentSort === "oldest") filtered.sort((a,b) => (a.pinned === b.pinned ? a.updatedAt - b.updatedAt : (b.pinned ? 1 : -1)));
      else if (currentSort === "az") filtered.sort((a,b) => (a.pinned === b.pinned ? (a.title || "").localeCompare(b.title || "") : (b.pinned ? 1 : -1)));
      else if (currentSort === "za") filtered.sort((a,b) => (a.pinned === b.pinned ? (a.title || "").localeCompare(a.title || "") : (b.pinned ? 1 : -1)));
      return filtered;
    }

    function renderNotesList() {
      const filtered = getFilteredAndSortedNotes();
      notesCountSpan.innerText = `${filtered.length} ${filtered.length === 1 ? 'note' : 'notes'}`;
      if (filtered.length === 0) {
        notesGridContainer.innerHTML = `<div class="empty-grid"><span class="empty-jp">まだノートがありません</span>No notes yet — tap + to write one</div>`;
        return;
      }
      const fragment = document.createDocumentFragment();
      for (const note of filtered) {
        const card = document.createElement('div');
        card.className = `note-card ${note.pinned ? 'pinned' : ''}`;
        card.setAttribute('data-id', note.id);
        const pinBtn = document.createElement('button');
        pinBtn.innerHTML = note.pinned ? ICONS.pinFilled : ICONS.pin;
        pinBtn.className = `pin-badge ${note.pinned ? 'pinned' : ''}`;
        pinBtn.title = note.pinned ? 'Unpin' : 'Pin';
        pinBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePin(note.id);
          animateElement(pinBtn, 'animate-pin', 200);
        });
        const titleDiv = document.createElement('div');
        titleDiv.className = 'note-title-preview';
        titleDiv.textContent = (note.title?.trim()) ? note.title : "Untitled";
        const snippetDiv = document.createElement('div');
        snippetDiv.className = 'note-snippet';
        let raw = note.content?.trim() || "";
        snippetDiv.textContent = raw.length > 110 ? raw.slice(0,107)+"..." : (raw || "(empty)");
        const metaDiv = document.createElement('div');
        metaDiv.className = 'card-meta';
        const date = new Date(note.updatedAt).toLocaleDateString(undefined, { month:'short', day:'numeric' });
        const timeSpan = document.createElement('span');
        timeSpan.textContent = date;
        const btnGroup = document.createElement('div');
        const dupIcon = document.createElement('button');
        dupIcon.innerHTML = ICONS.copy;
        dupIcon.className = 'icon-btn';
        dupIcon.title = 'Duplicate';
        dupIcon.addEventListener('click', (e) => {
          e.stopPropagation();
          duplicateNoteById(note.id);
          animateElement(dupIcon, 'animate-pulse', 150);
        });
        const delIcon = document.createElement('button');
        delIcon.innerHTML = ICONS.trash;
        delIcon.className = 'icon-btn danger';
        delIcon.title = 'Delete';
        delIcon.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('Delete note?')) {
            animateCard(card, true);
            setTimeout(() => deleteNoteById(note.id), 150);
          }
        });
        btnGroup.appendChild(dupIcon);
        btnGroup.appendChild(delIcon);
        metaDiv.appendChild(timeSpan);
        metaDiv.appendChild(btnGroup);
        card.appendChild(pinBtn);
        card.appendChild(titleDiv);
        card.appendChild(snippetDiv);
        card.appendChild(metaDiv);
        card.addEventListener('click', (e) => {
          if (e.target === pinBtn || pinBtn.contains(e.target)) return;
          if (e.target === delIcon || delIcon.contains(e.target) || e.target === dupIcon || dupIcon.contains(e.target)) return;
          openFullWindowForNote(note.id);
          animateElement(card, 'animate-pulse', 150);
        });
        fragment.appendChild(card);
      }
      notesGridContainer.innerHTML = '';
      notesGridContainer.appendChild(fragment);
      // add entry animation to all new cards
      document.querySelectorAll('.note-card').forEach(card => animateElement(card, 'animate-card-in', 200));
    }

    function togglePin(id) {
      const note = notesArray.find(n => n.id === id);
      if (note) { note.pinned = !note.pinned; persistNotes(); renderNotesList(); }
    }

    function duplicateNoteById(id) {
      const original = notesArray.find(n => n.id === id);
      if (!original) return;
      const newNote = {
        id: Date.now() + Math.random() * 10000,
        title: original.title ? original.title + " (copy)" : "",
        content: original.content,
        updatedAt: Date.now(),
        pinned: false
      };
      notesArray.push(newNote);
      persistNotes();
      renderNotesList();
      // flash count
      animateElement(notesCountSpan, 'animate-pulse', 200);
    }

    function deleteNoteById(id) {
      notesArray = notesArray.filter(n => n.id !== id);
      persistNotes();
      if (currentNoteId === id) closeFullWindowAndShowList();
      renderNotesList();
      animateElement(notesCountSpan, 'animate-pulse', 200);
    }

    function clearAllNotes() {
      if (notesArray.length === 0) return;
      if (confirm("Delete ALL notes permanently? This action cannot be undone.")) {
        notesArray = [];
        persistNotes();
        if (currentNoteId !== null) closeFullWindowAndShowList();
        renderNotesList();
        closeSettingsModal();
        animateElement(notesCountSpan, 'animate-pulse', 200);
      }
    }

    // full window animations on open/close
    function openFullWindowForNote(noteId) {
      const note = notesArray.find(n => n.id === noteId);
      if (!note) return;
      currentNoteId = note.id;
      isEditMode = false;
      viewTitleSpan.textContent = (note.title?.trim()) ? note.title : "Untitled";
      viewContentDiv.textContent = note.content || "(empty note)";
      editorTitle.value = note.title || "";
      editorBody.value = note.content || "";
      updateWordCharCount();
      viewModeContainer.classList.remove('hidden');
      editModeContainer.classList.add('hidden');
      updateActionButtonsForView();
      listViewDiv.classList.add('hidden');
      fullWindowDiv.classList.remove('hidden');
      animateElement(fullWindowDiv, 'animate-card-in', 200);
    }

    function openNewNoteEditor() {
      currentNoteId = null;
      isEditMode = true;
      editorTitle.value = "";
      editorBody.value = "";
      updateWordCharCount();
      viewModeContainer.classList.add('hidden');
      editModeContainer.classList.remove('hidden');
      updateActionButtonsForEdit(true);
      listViewDiv.classList.add('hidden');
      fullWindowDiv.classList.remove('hidden');
      animateElement(fullWindowDiv, 'animate-card-in', 200);
      editorBody.focus();
    }

    function switchToEditMode() {
      if (!currentNoteId) return;
      const note = notesArray.find(n => n.id === currentNoteId);
      if (!note) return;
      isEditMode = true;
      editorTitle.value = note.title || "";
      editorBody.value = note.content || "";
      updateWordCharCount();
      viewModeContainer.classList.add('hidden');
      editModeContainer.classList.remove('hidden');
      updateActionButtonsForEdit(false);
      editorBody.focus();
      animateElement(editModeContainer, 'animate-card-in', 150);
    }

    function saveFromEditMode() {
      const newTitle = editorTitle.value.trim();
      const newContent = editorBody.value.trim();
      if (newContent === "") { alert("Content cannot be empty"); return; }
      if (currentNoteId === null) {
        const newNote = { id: Date.now() + Math.random()*10000, title: newTitle, content: newContent, updatedAt: Date.now(), pinned: false };
        notesArray.push(newNote);
        persistNotes();
        renderNotesList();
        closeFullWindowAndShowList();
        animateElement(floatingAddBtn, 'animate-pulse', 200);
      } else {
        const idx = notesArray.findIndex(n => n.id === currentNoteId);
        if (idx !== -1) {
          notesArray[idx].title = newTitle;
          notesArray[idx].content = newContent;
          notesArray[idx].updatedAt = Date.now();
          persistNotes();
          renderNotesList();
          closeFullWindowAndShowList();
          animateElement(notesCountSpan, 'animate-pulse', 200);
        } else { closeFullWindowAndShowList(); renderNotesList(); }
      }
    }

    function cancelEdit() {
      if (currentNoteId === null) {
        if (confirm("Discard new note?")) closeFullWindowAndShowList();
      } else {
        const note = notesArray.find(n => n.id === currentNoteId);
        if (note) {
          viewTitleSpan.textContent = note.title?.trim() ? note.title : "Untitled";
          viewContentDiv.textContent = note.content || "(empty)";
          editorTitle.value = note.title || "";
          editorBody.value = note.content || "";
        }
        isEditMode = false;
        viewModeContainer.classList.remove('hidden');
        editModeContainer.classList.add('hidden');
        updateActionButtonsForView();
        animateElement(viewModeContainer, 'animate-card-in', 150);
      }
    }

    function deleteCurrentNote() {
      if (currentNoteId !== null) {
        if (confirm("Delete this note?")) {
          animateElement(fullWindowDiv, 'animate-card-out', 150);
          setTimeout(() => deleteNoteById(currentNoteId), 150);
        }
      } else {
        if (confirm("Discard new note?")) closeFullWindowAndShowList();
      }
    }

    function duplicateCurrentNote() {
      if (currentNoteId !== null) {
        duplicateNoteById(currentNoteId);
        closeFullWindowAndShowList();
      }
    }

    function closeFullWindowAndShowList() {
      listViewDiv.classList.remove('hidden');
      fullWindowDiv.classList.add('hidden');
      currentNoteId = null;
      isEditMode = false;
    }

    function updateActionButtonsForView() {
      actionButtonsDiv.innerHTML = `
        <button class="edit-window-btn" id="editModeBtn">Edit</button>
        <button class="duplicate-window-btn" id="duplicateWindowBtn">Duplicate</button>
        <button class="delete-window-btn" id="deleteWindowBtn">Delete</button>
      `;
      document.getElementById('editModeBtn')?.addEventListener('click', switchToEditMode);
      document.getElementById('duplicateWindowBtn')?.addEventListener('click', duplicateCurrentNote);
      document.getElementById('deleteWindowBtn')?.addEventListener('click', deleteCurrentNote);
    }

    function updateActionButtonsForEdit(isNew) {
      if (isNew) {
        actionButtonsDiv.innerHTML = `<button class="save-window-btn" id="saveEditBtn">Save</button><button class="cancel-window-btn" id="cancelEditBtn">Cancel</button>`;
      } else {
        actionButtonsDiv.innerHTML = `<button class="save-window-btn" id="saveEditBtn">Save</button><button class="cancel-window-btn" id="cancelEditBtn">Cancel</button><button class="delete-window-btn" id="deleteWindowBtn">Delete</button>`;
        document.getElementById('deleteWindowBtn')?.addEventListener('click', deleteCurrentNote);
      }
      document.getElementById('saveEditBtn')?.addEventListener('click', saveFromEditMode);
      document.getElementById('cancelEditBtn')?.addEventListener('click', cancelEdit);
    }

    function updateWordCharCount() {
      const text = editorBody.value;
      const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
      if (wordCountSpan) wordCountSpan.innerText = `${words} words`;
      if (charCountSpan) charCountSpan.innerText = `${text.length} characters`;
    }

    function initTheme() {
      const saved = ls.getItem('velvet_theme');
      if (saved === 'dark') document.body.classList.add('dark');
    }
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      ls.setItem('velvet_theme', isDark ? 'dark' : 'light');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', isDark ? '#171a26' : '#f7f2e9');
      animateElement(document.body, 'animate-card-in', 200);
    }

    function openSettingsModal() { settingsModal.classList.add('active'); animateElement(settingsModal.querySelector('.settings-modal'), 'animate-modal-in', 200); }
    function closeSettingsModal() { settingsModal.classList.remove('active'); }

    // Event binding with animations for button clicks
    floatingAddBtn.addEventListener('click', () => { animateElement(floatingAddBtn, 'animate-pulse', 150); openNewNoteEditor(); });
    backToListBtn.addEventListener('click', () => { animateElement(backToListBtn, 'animate-pulse', 150); closeFullWindowAndShowList(); });
    searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; renderNotesList(); });
    sortSelect.addEventListener('change', (e) => { currentSort = e.target.value; renderNotesList(); });
    settingsCog.addEventListener('click', () => { animateElement(settingsCog, 'animate-pulse', 150); openSettingsModal(); });
    closeSettingsBtn.addEventListener('click', closeSettingsModal);
    modalThemeBtn.addEventListener('click', () => { animateElement(modalThemeBtn, 'animate-pulse', 150); toggleTheme(); closeSettingsModal(); });
    modalClearAllBtn.addEventListener('click', () => { animateElement(modalClearAllBtn, 'animate-pulse', 150); clearAllNotes(); });
    settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) closeSettingsModal(); });
    editorBody.addEventListener('input', updateWordCharCount);
    editorTitle.addEventListener('input', updateWordCharCount);
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey||e.metaKey) && e.key==='s' && !editModeContainer.classList.contains('hidden')) {
        e.preventDefault(); saveFromEditMode();
      }
      if (e.key === 'Escape' && settingsModal.classList.contains('active')) closeSettingsModal();
    });

    loadInitialNotes();
    renderNotesList();
    initTheme();
    fullWindowDiv.classList.add('hidden');
    listViewDiv.classList.remove('hidden');
  })();
</script>

<!-- falling sakura petals -->
<script>
  (function () {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    var TOTAL = 8;
    function spawnPetal() {
      var p = document.createElement('span');
      p.className = 'petal';
      var size = 7 + Math.random() * 7;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.setProperty('--drift', (Math.random() * 22 - 9).toFixed(1) + 'vw');
      p.style.setProperty('--spin', Math.round(140 + Math.random() * 320) + 'deg');
      p.style.setProperty('--po', (0.22 + Math.random() * 0.26).toFixed(2));
      p.style.animationDuration = (10 + Math.random() * 11).toFixed(1) + 's';
      p.style.animationDelay = (Math.random() * 5).toFixed(1) + 's';
      p.addEventListener('animationend', function () { p.remove(); spawnPetal(); });
      document.body.appendChild(p);
    }
    for (var i = 0; i < TOTAL; i++) spawnPetal();
  })();
</script>

<!-- PWA: register service worker so the app saves locally & opens without internet -->
<script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        // Small one-time confirmation toast
        try {
          if (!localStorage.getItem('velvet_offline_ready')) {
            localStorage.setItem('velvet_offline_ready', '1');
            var toast = document.createElement('div');
            toast.textContent = '🌸 Saved for offline use';
            toast.setAttribute('style', [
              'position:fixed', 'bottom:88px', 'right:16px', 'z-index:9999',
              'background:#bd4437', 'color:#fffdf8', 'padding:10px 18px',
              'border-radius:30px', 'font-size:0.8rem', 'font-family:inherit',
              'box-shadow:0 10px 24px -8px rgba(189,68,64,.4)',
              'opacity:0', 'transform:translateY(8px)', 'transition:all .3s'
            ].join(';'));
            document.body.appendChild(toast);
            requestAnimationFrame(function () {
              toast.style.opacity = '1';
              toast.style.transform = 'translateY(0)';
            });
            setTimeout(function () {
              toast.style.opacity = '0';
              setTimeout(function () { toast.remove(); }, 350);
            }, 3000);
          }
        } catch (e) {}
      }).catch(function (err) {
        console.warn('Service Worker registration failed:', err);
      });
    });
  })();
</script>
